<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад занять</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- <link rel="icon" type="image/svg+xml" href="images/favicon.svg"> -->
	<link rel="icon" href="images/favicon.ico" sizes="all">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container-fluid px-2 px-md-4">
    <header class="d-flex flex-column align-items-center mb-3">
        <h1 class="main-title fw-bold mb-3 text-center">Розклад занять</h1>

        <div class="btn-group shadow-sm mb-2" role="group" id="week-selector">
            <button type="button" class="btn btn-outline-primary px-3 px-md-4 py-2 fw-semibold" data-week="1">Непарний</button>
            <button type="button" class="btn btn-outline-primary px-3 px-md-4 py-2 fw-semibold" data-week="2">Парний</button>
        </div>

        <button id="reset-hidden-btn" class="btn btn-outline-danger btn-sm mb-2">Повернути приховані</button>

        <div class="btn-group w-100 shadow-sm d-md-none overflow-auto mt-1" role="group" id="mobile-day-buttons">
            <button type="button" class="btn btn-outline-secondary fw-semibold flex-fill" data-day="1">Пн</button>
            <button type="button" class="btn btn-outline-secondary fw-semibold flex-fill" data-day="2">Вт</button>
            <button type="button" class="btn btn-outline-secondary fw-semibold flex-fill" data-day="3">Ср</button>
            <button type="button" class="btn btn-outline-secondary fw-semibold flex-fill" data-day="4">Чт</button>
            <button type="button" class="btn btn-outline-secondary fw-semibold flex-fill" data-day="5">Пт</button>
            <button type="button" class="btn btn-outline-secondary fw-semibold flex-fill" data-day="6">Сб</button>
        </div>
    </header>

    <main class="table-responsive">
        <table class="table schedule-table">
            <thead>
                <tr>
                    <th class="time-col">Час</th>
                    <th data-day="1">Понеділок</th>
                    <th data-day="2">Вівторок</th>
                    <th data-day="3">Середа</th>
                    <th data-day="4">Четвер</th>
                    <th data-day="5">П'ятниця</th>
                    <th data-day="6">Субота</th>
                </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
        </table>
    </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
